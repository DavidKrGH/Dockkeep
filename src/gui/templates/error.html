{% extends "base.html" %}
{% block title %}{{ error.status_code }} {{ error.status_label }} - Dockkeep{% endblock %}

{% block content %}
<section class="panel panel-body max-w-2xl">
  <div class="text-xs font-semibold uppercase text-slate-500 dark:text-slate-400">
    {{ error.status_code }} {{ error.status_label }}
  </div>
  <h1 class="mt-2 text-2xl font-semibold text-slate-900 dark:text-slate-100">
    {{ error.code }}
  </h1>
  <p class="mt-4 whitespace-pre-wrap text-sm text-slate-700 dark:text-slate-300">
    {{ error.message }}
  </p>
  <div class="mt-6">
    <a href="javascript:history.back()" class="btn btn-secondary">Back</a>
  </div>
</section>
{% endblock %}
