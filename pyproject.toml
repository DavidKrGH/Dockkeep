[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dockkeep"
version = "1.0.1"
description = "Docker-first backup automation and backend wrapper"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.5.0",
    "croniter>=2.0.0",
    "filelock>=3.13.0",
    "tomlkit>=0.13.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.52.1",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.7",
    "sse-starlette>=1.8.0",
    "httpx>=0.27.0",
]

[project.scripts]
dk = "src.main:main"
dk-runtime = "src.runtime:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.gui" = [
    "static/css/*.css",
    "static/img/*.png",
    "static/js/*.js",
    "static/js/*.txt",
    "static/js/charts/*.js",
    "templates/*.html",
    "templates/fragments/*.html",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "croniter.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
