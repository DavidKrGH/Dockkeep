[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dockkeep"
version = "1.0.3"
description = "Docker-first backup automation and backend wrapper"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.5.0",
    "croniter>=2.0.0",
    "filelock>=3.13.0",
    "tomlkit>=0.13.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.7",
    "sse-starlette>=1.8.0",
    "httpx>=0.27.0",
]

# Entwicklungs-Dependencies. Stehen hier statt in einer eigenen Requirements-
# Datei, damit uv.lock sie mitpinnt und `make setup` exakt dieselben Versionen
# installiert, die auch die CI sieht. Gehen nicht ins Image: der Build ruft
# `uv export --no-dev` auf.
# uv taucht hier selbst auf, damit die lokale Version gepinnt ist. Wird sie
# angehoben, muss die uv-Version im Dockerfile mitwandern, sonst kann das
# gebaute uv das neuere Lockfile-Format nicht lesen.
[dependency-groups]
dev = [
    "uv>=0.12.2",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "debugpy>=1.8.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "httpx>=0.28.0",
]

[project.scripts]
dk = "src.main:main"
dk-runtime = "src.runtime:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.gui" = [
    "static/css/*.css",
    "static/img/*.png",
    "static/js/*.js",
    "static/js/*.txt",
    "static/js/charts/*.js",
    "templates/*.html",
    "templates/fragments/*.html",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "croniter.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
